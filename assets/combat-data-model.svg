    <g font-family="Segoe UI, Arial, sans-serif"><text x="40" y="53" font-size="15" fill="#9cbeff" font-weight="600">LITTLE KNIGHT / SYSTEM EVIDENCE</text><text x="40" y="101" font-size="34" fill="#f4f7fc" font-weight="600">Separate weapon parameters from actor state.</text><text x="40" y="139" font-size="20" fill="#bfcddd" font-weight="400">A condensed view of the original C# structures and their responsibilities.</text><rect x="40" y="185" width="355" height="302" rx="12" fill="#1b2d45" stroke="#43566f"/><rect x="40" y="185" width="5" height="302" rx="2" fill="#9cbeff"/><text x="65" y="224" font-size="25" fill="#f4f7fc" font-weight="600">WeaponData / stored</text><text x="65" y="263" font-size="21" fill="#bfcddd" font-weight="400">weaponID · weaponName</text><text x="65" y="295" font-size="21" fill="#bfcddd" font-weight="400">weaponTypeID</text><text x="65" y="327" font-size="21" fill="#bfcddd" font-weight="400">ATKPhysical · DEFPhysical</text><text x="65" y="359" font-size="21" fill="#bfcddd" font-weight="400">poiseDamage · staminaConsume</text><text x="65" y="391" font-size="21" fill="#bfcddd" font-weight="400">executionRate · r1a/b/cRate</text><text x="65" y="423" font-size="21" fill="#bfcddd" font-weight="400">allowCastMagic / Miracle</text><rect x="435" y="185" width="330" height="302" rx="12" fill="#1b2d45" stroke="#43566f"/><rect x="435" y="185" width="5" height="302" rx="2" fill="#9cbeff"/><text x="460" y="224" font-size="25" fill="#f4f7fc" font-weight="600">StatusManager / live</text><text x="460" y="263" font-size="21" fill="#bfcddd" font-weight="400">HP / max HP · alive</text><text x="460" y="295" font-size="21" fill="#bfcddd" font-weight="400">stamina / recovery</text><text x="460" y="327" font-size="21" fill="#bfcddd" font-weight="400">poise / 5 s recovery</text><text x="460" y="359" font-size="21" fill="#bfcddd" font-weight="400">Animator state checks</text><text x="460" y="391" font-size="21" fill="#bfcddd" font-weight="400">isAttack · isDefense · isParry</text><text x="460" y="423" font-size="21" fill="#bfcddd" font-weight="400">isAllowAttack / Roll / Defense</text><rect x="805" y="185" width="355" height="302" rx="12" fill="#1b2d45" stroke="#43566f"/><rect x="805" y="185" width="5" height="302" rx="2" fill="#9cbeff"/><text x="830" y="224" font-size="25" fill="#f4f7fc" font-weight="600">Combat / runtime</text><text x="830" y="263" font-size="21" fill="#bfcddd" font-weight="400">WeaponFactory: equip prefab</text><text x="830" y="295" font-size="21" fill="#bfcddd" font-weight="400">WeaponManager: clip overrides</text><text x="830" y="327" font-size="21" fill="#bfcddd" font-weight="400">WeaponController: hit values</text><text x="830" y="359" font-size="21" fill="#bfcddd" font-weight="400">BattleManager: resolve hit</text><text x="830" y="391" font-size="21" fill="#bfcddd" font-weight="400">Impact: choose reaction clip</text><text x="830" y="423" font-size="21" fill="#bfcddd" font-weight="400">ActorController: movement</text><path d="M395,335 L430,335" fill="none" stroke="#9cbeff" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M765,335 L800,335" fill="none" stroke="#9cbeff" stroke-width="2.5" marker-end="url(#arrow)"/><text x="40" y="536" font-size="18" fill="#c6e892" font-weight="600">LOAD → EQUIP → ACT → RESOLVE</text><text x="40" y="572" font-size="23" fill="#bfcddd" font-weight="400">Weapon JSON provides parameters; live actor state gates actions and receives the result.</text><text x="40" y="618" font-size="16" fill="#92a7c1" font-weight="400">Reconstructed from WeaponData, StatusManager, WeaponFactory and combat scripts; selected fields only.</text></g></svg>