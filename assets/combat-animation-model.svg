<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc">
    <title id="title">Animation is part of the combat contract.</title><desc id="desc">Two Animator layers compose movement and guard; overrides and Timeline serve distinct roles. Reconstructed from Actor.controller, upperBody.mask and C# code; not a Unity Editor capture.</desc>
    <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#9cbeff"/></marker></defs>
    <rect width="1200" height="880" rx="14" fill="#101d2e"/>
    <g font-family="Segoe UI, Arial, sans-serif"><text x="40" y="53" font-size="15" fill="#9cbeff" font-weight="600">LITTLE KNIGHT / SYSTEM EVIDENCE</text><text x="40" y="101" font-size="34" fill="#f4f7fc" font-weight="600">Animation is part of the combat contract.</text><text x="40" y="139" font-size="20" fill="#bfcddd" font-weight="400">Two Animator layers compose movement and guard; overrides and Timeline serve distinct roles.</text><rect x="40" y="185" width="550" height="213" rx="12" fill="#1b2d45" stroke="#43566f"/><rect x="40" y="185" width="5" height="213" rx="2" fill="#9cbeff"/><text x="65" y="224" font-size="25" fill="#f4f7fc" font-weight="600">Base Layer / full-body actions</text><text x="65" y="263" font-size="21" fill="#bfcddd" font-weight="400">Ground / locomotion · roll · jump / fall</text><text x="65" y="295" font-size="21" fill="#bfcddd" font-weight="400">Attack chain · parry · hit reaction</text><text x="65" y="327" font-size="21" fill="#bfcddd" font-weight="400">State-enter / exit callbacks control action locks</text><rect x="630" y="185" width="530" height="213" rx="12" fill="#1b2d45" stroke="#43566f"/><rect x="630" y="185" width="5" height="213" rx="2" fill="#c6e892"/><text x="655" y="224" font-size="25" fill="#f4f7fc" font-weight="600">defense / masked override</text><text x="655" y="263" font-size="21" fill="#bfcddd" font-weight="400">Idle ↔ defense1h</text><text x="655" y="295" font-size="21" fill="#bfcddd" font-weight="400">upperBody Avatar Mask</text><text x="655" y="327" font-size="21" fill="#bfcddd" font-weight="400">Layer weight controlled by shield / defense state</text><path d="M312,398 L312,430" fill="none" stroke="#9cbeff" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M895,398 L895,430" fill="none" stroke="#9cbeff" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="435" width="1120" height="128" rx="12" fill="#1b2d45" stroke="#43566f"/><rect x="40" y="435" width="5" height="128" rx="2" fill="#9cbeff"/><text x="65" y="474" font-size="25" fill="#f4f7fc" font-weight="600">Composite pose / locomotion + shield</text><text x="65" y="513" font-size="21" fill="#bfcddd" font-weight="400">The base continues movement; the masked layer supplies the guard pose.</text><rect x="40" y="603" width="550" height="163" rx="12" fill="#1b2d45" stroke="#43566f"/><rect x="40" y="603" width="5" height="163" rx="2" fill="#9cbeff"/><text x="65" y="642" font-size="25" fill="#f4f7fc" font-weight="600">AnimatorOverrideController</text><text x="65" y="681" font-size="21" fill="#bfcddd" font-weight="400">Weapon type → three attack clips</text><text x="65" y="713" font-size="21" fill="#bfcddd" font-weight="400">Hit impact → reaction clip</text><rect x="630" y="603" width="530" height="163" rx="12" fill="#1b2d45" stroke="#43566f"/><rect x="630" y="603" width="5" height="163" rx="2" fill="#9cbeff"/><text x="655" y="642" font-size="25" fill="#f4f7fc" font-weight="600">PlayableDirector / execution</text><text x="655" y="681" font-size="21" fill="#bfcddd" font-weight="400">Attacker + victim animation tracks</text><text x="655" y="713" font-size="21" fill="#bfcddd" font-weight="400">Align → lock → damage → unlock</text><text x="40" y="811" font-size="22" fill="#bfcddd" font-weight="400">Root motion: Animator.deltaPosition → ActorController → Rigidbody / FixedUpdate</text><text x="40" y="853" font-size="16" fill="#92a7c1" font-weight="400">Reconstructed from Actor.controller, upperBody.mask and C# code; not a Unity Editor capture.</text></g></svg>