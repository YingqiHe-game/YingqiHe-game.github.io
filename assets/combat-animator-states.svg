<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="861" viewBox="0 0 1200 861" role="img" aria-labelledby="title desc">
    <title id="title">Read the controller by responsibility.</title><desc id="desc">State groups retained in the original Actor.controller; transition wiring is simplified. attack is a Base Layer sub-state machine, not a third animation layer. Reconstructed from the asset.</desc>
    <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#9cbeff"/></marker></defs>
