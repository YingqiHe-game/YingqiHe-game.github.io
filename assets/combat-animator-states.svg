    <g font-family="Segoe UI, Arial, sans-serif"><text x="40" y="53" font-size="15" fill="#9cbeff" font-weight="600">LITTLE KNIGHT / SYSTEM EVIDENCE</text><text x="40" y="101" font-size="34" fill="#f4f7fc" font-weight="600">Read the controller by responsibility.</text><text x="40" y="139" font-size="20" fill="#bfcddd" font-weight="400">State groups retained in the original Actor.controller; transition wiring is simplified.</text><rect x="40" y="185" width="1120" height="435" rx="12" fill="#1b2d45" stroke="#43566f"/><rect x="40" y="185" width="5" height="435" rx="2" fill="#9cbeff"/><text x="65" y="224" font-size="25" fill="#f4f7fc" font-weight="600">Base Layer / state-machine structure</text><text x="65" y="263" font-size="21" fill="#bfcddd" font-weight="400">Full-body states: hit reaction · death · block stun · parry stun · parry · wait</text><rect x="70" y="305" width="485" height="255" rx="12" fill="#1b2d45" stroke="#43566f"/><rect x="70" y="305" width="5" height="255" rx="2" fill="#9cbeff"/><text x="95" y="344" font-size="25" fill="#f4f7fc" font-weight="600">localMotion / sub-state machine</text><text x="95" y="383" font-size="21" fill="#bfcddd" font-weight="400">ground · jab · jump · fall · landing</text><text x="95" y="415" font-size="21" fill="#bfcddd" font-weight="400">roll: eight directional states</text><text x="95" y="447" font-size="21" fill="#bfcddd" font-weight="400">Movement and airborne state transitions</text><rect x="590" y="305" width="535" height="255" rx="12" fill="#1b2d45" stroke="#43566f"/><rect x="590" y="305" width="5" height="255" rx="2" fill="#9cbeff"/><text x="615" y="344" font-size="25" fill="#f4f7fc" font-weight="600">attack / sub-state machine</text><text x="615" y="383" font-size="21" fill="#bfcddd" font-weight="400">Three-step right-hand attack chain</text><text x="615" y="415" font-size="21" fill="#bfcddd" font-weight="400">Three-step mirrored left-hand chain</text><text x="615" y="447" font-size="21" fill="#bfcddd" font-weight="400">lightAttack / leftHand / animLock conditions</text><rect x="40" y="655" width="1120" height="140" rx="12" fill="#1b2d45" stroke="#43566f"/><rect x="40" y="655" width="5" height="140" rx="2" fill="#c6e892"/><text x="65" y="694" font-size="25" fill="#f4f7fc" font-weight="600">defense / separate masked layer</text><text x="65" y="733" font-size="21" fill="#bfcddd" font-weight="400">idle ↔ defense1h · shield input + allowed state control its weight</text><text x="40" y="834" font-size="16" fill="#92a7c1" font-weight="400">attack is a Base Layer sub-state machine, not a third animation layer. Reconstructed from the asset.</text></g></svg>