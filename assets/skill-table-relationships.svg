xt><text x="840" y="767" font-size="21" fill="#bfcddd" font-weight="400">buff_id → buff.id</text><path d="M540,580 L213,620" fill="none" stroke="#9cbeff" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M690,580 L600,620" fill="none" stroke="#9cbeff" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1020,580 L987,620" fill="none" stroke="#9cbeff" stroke-width="2.5" marker-end="url(#arrow)"/><text x="40" y="854" font-size="21" fill="#bfcddd" font-weight="400">Hit volumes and projectiles apply referenced effects; effects can evaluate formulas or add buffs.</text><text x="40" y="896" font-size="16" fill="#92a7c1" font-weight="400">Reconstructed from skill, actor_skill, hit_volume, projectile, effect, buff and formula configuration.</text></g></svg>